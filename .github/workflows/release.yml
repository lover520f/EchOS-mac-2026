name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      # 版本号以 Git 标签为准（如 v1.0.1 → 1.0.1），写回 Info.plist，
      # 这样 DMG 文件名自动是 EchOS-mac-1.0.1-universal-x64.dmg。
      - name: Set version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Building version: $VER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" gui/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" gui/Info.plist

      - name: Build app
        run: ./build.sh

      - name: Package DMG
        # CI 没有 GUI 会话，跳过 Finder 布局（make-dmg.sh 里 FINDER_LAYOUT=0 会跳过）
        run: FINDER_LAYOUT=0 ./make-dmg.sh

      - name: List artifacts
        run: ls -la build/

      # 改动说明自动生成：GitHub 根据两个 Release 之间的 commit / PR
      # 生成「What's Changed」列表。上一个版本标签直接用 git 历史里找
      # （不依赖 Release 创建顺序，两个 tag 一起推也稳）；首个版本没有
      # 前一个标签，就只输出静态说明。想要人工润色时，Release 发布后
      # 可直接在 GitHub 网页上编辑正文。
      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            NOTES=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$(git rev-parse HEAD)" \
              -f previous_tag_name="$PREV" \
              --jq '.body')
          else
            NOTES="首次发布，包含完整功能。"
          fi
          {
            echo "## EchOS $TAG"
            echo ""
            echo "macOS 13.0+，Intel 与 Apple Silicon 通用。"
            echo ""
            echo "- 下载 \`EchOS-mac-*-universal-x64.dmg\` 后拖入 Applications"
            echo "- 无 Apple 开发者签名，首次打开需右键 → 打开（Gatekeeper）"
            echo ""
            echo "$NOTES"
          } > RELEASE_BODY.md

      - name: Create release & upload DMG
        # 由标签触发；GitHub 会自动给每个 Release 附上
        # "Source code (zip)" 和 "Source code (tar.gz)"
        uses: softprops/action-gh-release@v2
        with:
          name: EchOS ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: build/EchOS-mac-*.dmg
